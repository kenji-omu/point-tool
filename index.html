<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ポイント計算ツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Hiragino Sans', sans-serif; background: #f2f2f7; }

/* ── ヘッダー ── */
.header { background: #1c1c1e; padding: 14px 14px 12px; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.header-title { color: #fff; font-size: 18px; font-weight: 700; }
.edit-btn { background: #3a3a3c; color: #ccc; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
.badge-red { background: #ff3b30; color: #fff; }
.badge-blue { background: #0a84ff; color: #fff; }

/* ── セクション ── */
.section { padding: 13px 13px 0; }
.sec-lbl { font-size: 11px; font-weight: 700; color: #8e8e93; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }

/* ── キャリア ── */
.carrier-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.carrier-btn { padding: 15px 2px; border: 3px solid transparent; border-radius: 12px; font-size: 14px; font-weight: 800; color: #fff; cursor: pointer; text-align: center; }
.carrier-btn:active { opacity: 0.8; }
.carrier-btn.sel { border-color: #ffd60a; }
.c-docomo { background: #e60012; }
.c-au     { background: #ea5504; }
.c-sb     { background: #3a3a3c; }
.c-ym     { background: #b5006e; }
.c-uq     { background: #0095d9; }

/* ── 信賞店舗バー ── */
.shinsho-bar { background: #fff8dc; border: 2px solid #ffc83d; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.shinsho-bar.on { background: #d4f7e0; border-color: #30d158; }
.sw { width: 50px; height: 28px; background: #ccc; border-radius: 14px; position: relative; flex-shrink: 0; transition: background 0.2s; }
.sw.on { background: #30d158; }
.sw::after { content: ''; position: absolute; width: 24px; height: 24px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.2s; }
.sw.on::after { transform: translateX(22px); }

/* ── 前提条件 ── */
.prereq-box { background: #fff8dc; border: 2px solid #ffc83d; border-radius: 12px; overflow: hidden; }
.prereq-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; }
.prereq-row:not(:last-child) { border-bottom: 1px solid #ffe08a; }
.chk { width: 30px; height: 30px; border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: #fff; }
.chk.on { background: #30d158; border-color: #30d158; color: #fff; }
.prereq-main { font-size: 15px; font-weight: 700; }
.prereq-sub { font-size: 11px; color: #777; margin-top: 2px; }

/* ── 条件カード ── */
.cond-list { display: flex; flex-direction: column; gap: 7px; }
.cond-card { background: #fff; border-radius: 12px; border: 2px solid transparent; overflow: hidden; cursor: pointer; }
.cond-card:active { opacity: 0.85; }
.cond-card.on { border-color: #30d158; background: #f0fff5; }
.cond-card.off-zero, .cond-card.off-req { opacity: 0.38; pointer-events: none; }
.cond-row { display: flex; align-items: center; gap: 11px; padding: 13px 14px; }
.cond-chk { width: 30px; height: 30px; border: 2px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.cond-card.on .cond-chk { background: #30d158; border-color: #30d158; color: #fff; }
.cond-info { flex: 1; }
.cond-name { font-size: 15px; font-weight: 700; }
.cond-note { font-size: 11px; color: #888; margin-top: 2px; line-height: 1.4; }
.pts { font-size: 21px; font-weight: 800; color: #ff3b30; flex-shrink: 0; }
.pts.zero { color: #c7c7cc; font-size: 14px; font-weight: 500; }
.sub-row { display: none; background: #f7f7f7; padding: 10px 14px; border-top: 1px solid #e5e5ea; align-items: center; gap: 10px; }
.sub-row.show { display: flex; }
.sub-lbl { font-size: 13px; color: #555; flex: 1; }
.sub-num { width: 62px; padding: 7px; font-size: 19px; font-weight: 700; text-align: center; border: 2px solid #ccc; border-radius: 8px; background: #fff; }
.sub-unit { font-size: 13px; color: #555; }
.sub-chk { width: 30px; height: 30px; border: 2px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; background: #fff; }
.sub-chk.on { background: #30d158; border-color: #30d158; color: #fff; }

/* ── 合計バー ── */
.total-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: #1c1c1e; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -2px 20px rgba(0,0,0,0.5); }
.total-lbl { color: #8e8e93; font-size: 12px; }
.total-carrier { color: #fff; font-size: 17px; font-weight: 800; margin-top: 2px; }
.total-num { color: #ffd60a; font-size: 40px; font-weight: 800; line-height: 1; }
.total-unit { color: #8e8e93; font-size: 15px; margin-left: 3px; }
.reset-btn { background: #3a3a3c; color: #8e8e93; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; margin-left: 8px; }
.bottom-pad { height: 90px; }
.placeholder { text-align: center; color: #aaa; font-size: 16px; padding: 40px 16px; line-height: 2; }

/* ── ローディング ── */
#loading { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: none; align-items: center; justify-content: center; }
#loading.show { display: flex; }
.loading-box { background: #fff; border-radius: 16px; padding: 30px 40px; text-align: center; font-size: 16px; font-weight: 700; }
.spinner { width: 36px; height: 36px; border: 4px solid #f0f0f0; border-top-color: #0a84ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── PINモーダル ── */
#pin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 600; display: none; align-items: center; justify-content: center; }
#pin-modal.show { display: flex; }
.pin-box { background: #fff; border-radius: 20px; padding: 28px 24px; width: 300px; text-align: center; }
.pin-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.pin-sub { font-size: 13px; color: #8e8e93; margin-bottom: 20px; }
.pin-input { width: 100%; padding: 14px; font-size: 28px; font-weight: 700; text-align: center; border: 2px solid #e5e5ea; border-radius: 12px; letter-spacing: 8px; margin-bottom: 8px; }
.pin-input:focus { border-color: #0a84ff; outline: none; }
.pin-error { color: #ff3b30; font-size: 13px; min-height: 20px; margin-bottom: 12px; }
.pin-submit { width: 100%; padding: 14px; background: #0a84ff; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
.pin-cancel { width: 100%; padding: 10px; background: none; color: #8e8e93; border: none; font-size: 14px; cursor: pointer; }

/* ── 設定画面 ── */
#settings-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f2f2f7; overflow-y: auto; z-index: 200; transform: translateX(100%); transition: transform 0.28s ease; }
#settings-screen.open { transform: translateX(0); }
.s-header { background: #1c1c1e; padding: 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
.s-back { background: #3a3a3c; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.s-title { color: #fff; font-size: 16px; font-weight: 700; flex: 1; }
.s-save { background: #30d158; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.s-save:disabled { background: #8e8e93; }

.s-block { background: #fff; border-radius: 12px; margin: 13px 13px 0; overflow: hidden; }
.s-block-title { padding: 8px 14px; font-size: 11px; font-weight: 700; color: #8e8e93; letter-spacing: 0.5px; text-transform: uppercase; background: #f8f8f8; border-bottom: 1px solid #f0f0f0; }
.s-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #f5f5f5; }
.s-row:last-child { border-bottom: none; }
.s-row-lbl { flex: 1; font-size: 15px; color: #1c1c1e; }
.s-text { flex: 1; padding: 8px 10px; font-size: 15px; border: 2px solid #e5e5ea; border-radius: 8px; }
.s-text:focus { border-color: #0a84ff; outline: none; }

/* ── 設定：条件エディタ ── */
.s-cond-card { background: #fff; border-radius: 12px; margin: 8px 13px 0; overflow: hidden; border: 2px solid transparent; }
.s-cond-card.expanded { border-color: #0a84ff; }
.s-cond-header { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; }
.s-cond-order { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.s-order-btn { background: #f0f0f0; border: none; border-radius: 5px; width: 28px; height: 24px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.s-order-btn:active { background: #ddd; }
.s-cond-preview { flex: 1; }
.s-cond-preview-name { font-size: 15px; font-weight: 700; }
.s-cond-preview-note { font-size: 11px; color: #8e8e93; margin-top: 2px; }
.s-expand-icon { color: #8e8e93; font-size: 13px; }

.s-cond-body { padding: 0 14px 14px; border-top: 1px solid #f0f0f0; }
.s-field { margin-top: 12px; }
.s-field-label { font-size: 12px; font-weight: 700; color: #8e8e93; margin-bottom: 4px; }
.s-field-input { width: 100%; padding: 10px 12px; font-size: 15px; border: 2px solid #e5e5ea; border-radius: 8px; }
.s-field-input:focus { border-color: #0a84ff; outline: none; }

.s-flags { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.s-flag { display: flex; align-items: center; gap: 8px; background: #f8f8f8; border-radius: 8px; padding: 8px 12px; cursor: pointer; flex: 1; min-width: 140px; }
.s-flag-label { font-size: 13px; flex: 1; }
.mini-sw { width: 40px; height: 24px; background: #ccc; border-radius: 12px; position: relative; flex-shrink: 0; transition: background 0.2s; }
.mini-sw.on { background: #30d158; }
.mini-sw::after { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.2s; }
.mini-sw.on::after { transform: translateX(16px); }

.s-unit-row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.s-unit-item { display: flex; align-items: center; gap: 6px; background: #f8f8f8; border-radius: 8px; padding: 8px 12px; flex: 1; min-width: 160px; }
.s-unit-label { font-size: 13px; flex: 1; }
.s-unit-input { width: 56px; padding: 6px; font-size: 16px; font-weight: 700; text-align: center; border: 2px solid #ccc; border-radius: 6px; }

.s-pts-section { margin-top: 12px; }
.s-pts-title { font-size: 12px; font-weight: 700; color: #8e8e93; margin-bottom: 6px; }
.s-pts-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f5f5f5; }
.s-pts-row:last-child { border-bottom: none; }
.s-carrier-badge { padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; color: #fff; width: 72px; text-align: center; flex-shrink: 0; }
.s-carrier-badge.docomo { background: #e60012; }
.s-carrier-badge.au     { background: #ea5504; }
.s-carrier-badge.sb     { background: #3a3a3c; }
.s-carrier-badge.ym     { background: #b5006e; }
.s-carrier-badge.uq     { background: #0095d9; }
.s-pts-input { width: 90px; padding: 7px; font-size: 16px; font-weight: 700; text-align: right; border: 2px solid #e5e5ea; border-radius: 8px; }
.s-pts-input:focus { border-color: #0a84ff; outline: none; }
.s-shinsho-lbl { font-size: 11px; color: #8e8e93; margin-left: 4px; white-space: nowrap; }

.s-delete-btn { margin-top: 14px; width: 100%; padding: 11px; background: #fff0f0; color: #ff3b30; border: 2px solid #ffcdd2; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }

.s-add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 13px 0; padding: 14px; background: #e8f4ff; border: 2px dashed #0a84ff; border-radius: 12px; color: #0a84ff; font-size: 15px; font-weight: 700; cursor: pointer; }
.s-bottom-pad { height: 40px; }
</style>
</head>
<body>

<!-- ローディング -->
<div id="loading"><div class="loading-box"><div class="spinner"></div>データを読み込み中...</div></div>

<!-- PINモーダル -->
<div id="pin-modal">
  <div class="pin-box">
    <div class="pin-title">編集モード</div>
    <div class="pin-sub">PINコードを入力してください</div>
    <input class="pin-input" id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="----">
    <div class="pin-error" id="pin-error"></div>
    <button class="pin-submit" onclick="submitPin()">確認</button>
    <button class="pin-cancel" onclick="closePinModal()">キャンセル</button>
  </div>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <div class="header">
    <div class="header-top">
      <div class="header-title">📱 ポイント計算ツール</div>
      <button class="edit-btn" onclick="openPinModal()">✏️ 編集</button>
    </div>
    <div class="badges">
      <span class="badge badge-red">期限：<span id="deadline-disp"></span></span>
      <span class="badge badge-blue">MNP前提</span>
    </div>
  </div>

  <div class="section" style="margin-top:14px;">
    <div class="sec-lbl">① キャリアを選択</div>
    <div class="carrier-grid">
      <button class="carrier-btn c-docomo" onclick="selectCarrier('docomo')">ドコモ</button>
      <button class="carrier-btn c-au"     onclick="selectCarrier('au')">AU</button>
      <button class="carrier-btn c-sb"     onclick="selectCarrier('sb')">SB</button>
      <button class="carrier-btn c-ym"     onclick="selectCarrier('ym')">YM</button>
      <button class="carrier-btn c-uq"     onclick="selectCarrier('uq')">UQ</button>
    </div>
  </div>

  <div id="shinsho-section" class="section" style="margin-top:11px; display:none;">
    <div id="shinsho-bar" class="shinsho-bar" onclick="toggleShinsho()">
      <div class="sw" id="shinsho-sw"></div>
      <div>
        <div style="font-size:15px;font-weight:700;" id="shinsho-main">通常店舗</div>
        <div style="font-size:11px;color:#666;margin-top:2px;" id="shinsho-sub"></div>
      </div>
    </div>
  </div>

  <div class="section" style="margin-top:11px;">
    <div class="sec-lbl">② 前提条件（どちらか一方でOP加入可）</div>
    <div class="prereq-box">
      <div class="prereq-row" onclick="togglePrereq('bunkatsu')">
        <div class="chk" id="pi-bunkatsu"></div>
        <div>
          <div class="prereq-main">ノジマ分割（分割リセット）</div>
          <div class="prereq-sub">ノジマで分割払いを組む</div>
        </div>
      </div>
      <div class="prereq-row" onclick="togglePrereq('shitadori')">
        <div class="chk" id="pi-shitadori"></div>
        <div>
          <div class="prereq-main">端末下取りあり</div>
          <div class="prereq-sub">どちらか一方で①OP加入が可能</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section" style="margin-top:11px;">
    <div class="sec-lbl">③ 追加条件（タップでON/OFF）</div>
    <div class="cond-list" id="cond-list">
      <div class="placeholder">⬆️ まずキャリアを選択してください</div>
    </div>
  </div>
  <div class="bottom-pad"></div>
</div>

<!-- 設定画面 -->
<div id="settings-screen">
  <div class="s-header">
    <button class="s-back" onclick="discardSettings()">← 戻る</button>
    <div class="s-title">数値を編集</div>
    <button class="s-save" id="s-save-btn" onclick="saveSettings()">💾 全員に反映</button>
  </div>

  <div class="s-block" style="margin-top:18px;">
    <div class="s-block-title">施策期限</div>
    <div class="s-row">
      <div class="s-row-lbl">期限テキスト（例：27日（月））</div>
      <input class="s-text" id="s-deadline" style="max-width:160px;" type="text">
    </div>
  </div>

  <div style="margin: 16px 13px 6px; font-size:11px; font-weight:700; color:#8e8e93; letter-spacing:0.5px; text-transform:uppercase;">条件一覧</div>
  <div id="s-cond-list"></div>
  <div class="s-add-btn" onclick="addCondition()">＋ 条件を追加</div>
  <div class="s-bottom-pad"></div>
</div>

<!-- 合計バー -->
<div class="total-bar">
  <div>
    <div class="total-lbl">合計ポイント</div>
    <div class="total-carrier" id="total-carrier">-</div>
  </div>
  <div style="display:flex;align-items:center;">
    <span class="total-num" id="total-num">0</span>
    <span class="total-unit">pt</span>
    <button class="reset-btn" onclick="resetAll()">リセット</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
// ▼▼▼ Google Apps Script URLをここに設定してください ▼▼▼
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKP579vdZXL8L2mdFeISgX2QXtvaimj542SjPOu4eAkNKgS3nh0nCkwQElsbeyeDS7UA/exec';
// ════════════════════════════════════════════════════════

const CARRIERS = ['docomo','au','sb','ym','uq'];
const C_LABEL  = { docomo:'ドコモ', au:'AU', sb:'SoftBank', ym:'Y!mobile', uq:'UQ' };

const DEFAULT_CONFIG = { deadline: '27日（月）', pin: '1234' };
const DEFAULT_CONDITIONS = [
  { id:'op',      name:'①OP加入',       note:'分割リセット or 下取り', needs_prereq:1, docomo_unit_min:0, au_unit_min:0, uq_denki:0, docomo:11000, docomo_shinsho:0,     au:11000, sb:10000, ym:10000, uq:0     },
  { id:'hikari',  name:'②光セット割加入', note:'信賞店舗で増額あり',    needs_prereq:0, docomo_unit_min:0, au_unit_min:0, uq_denki:1, docomo:10000, docomo_shinsho:10000, au:0,     sb:10000, ym:10000, uq:11000 },
  { id:'gold',    name:'③GOLDカード',    note:'AU:同日同店台数×pt',    needs_prereq:0, docomo_unit_min:0, au_unit_min:2, uq_denki:0, docomo:20000, docomo_shinsho:0,     au:5000,  sb:0,     ym:0,     uq:0     },
  { id:'silver',  name:'④SILVERカード',  note:'',                     needs_prereq:0, docomo_unit_min:0, au_unit_min:0, uq_denki:0, docomo:5000,  docomo_shinsho:0,     au:0,     sb:0,     ym:0,     uq:0     },
  { id:'kazoku',  name:'⑤家族割申込',    note:'ドコモ:台当たり',       needs_prereq:0, docomo_unit_min:1, au_unit_min:0, uq_denki:0, docomo:20000, docomo_shinsho:0,     au:11000, sb:0,     ym:0,     uq:0     },
  { id:'kaden',   name:'⑥家電セット',    note:'信賞店舗で増額（ドコモ）', needs_prereq:0, docomo_unit_min:0, au_unit_min:0, uq_denki:0, docomo:10000, docomo_shinsho:10000, au:10000, sb:0,     ym:0,     uq:5000  },
  { id:'sim_mnp', name:'SIM単MNP還元',   note:'',                     needs_prereq:0, docomo_unit_min:0, au_unit_min:0, uq_denki:0, docomo:15000, docomo_shinsho:0,     au:15000, sb:10000, ym:15000, uq:15000 },
  { id:'sim_new', name:'SIM単新規還元',   note:'※新規も可',            needs_prereq:0, docomo_unit_min:0, au_unit_min:0, uq_denki:0, docomo:0,     docomo_shinsho:0,     au:0,     sb:0,     ym:10000, uq:3850  },
];

/* ── 状態 ── */
let config     = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let conditions = JSON.parse(JSON.stringify(DEFAULT_CONDITIONS));
let carrier    = null;
let prereqs    = { bunkatsu: false, shitadori: false };
let checked    = {};
let units      = {};
let uqDenki    = false;
let shinsho    = false;
let enteredPin = '';
let draftConfig, draftConditions, expandedId;

/* ── Google Sheets連携 ── */
async function loadFromSheet() {
  if (!SCRIPT_URL) return;
  showLoading(true);
  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    if (data.config)     config = { ...DEFAULT_CONFIG, ...data.config };
    if (data.conditions && data.conditions.length > 0) {
      conditions = data.conditions.map(c => ({
        id: String(c.id), name: String(c.name || ''), note: String(c.note || ''),
        needs_prereq: +c.needs_prereq || 0, docomo_unit_min: +c.docomo_unit_min || 0,
        au_unit_min: +c.au_unit_min || 0,   uq_denki: +c.uq_denki || 0,
        docomo: +c.docomo || 0, docomo_shinsho: +c.docomo_shinsho || 0,
        au: +c.au || 0, sb: +c.sb || 0, ym: +c.ym || 0, uq: +c.uq || 0,
      }));
    }
  } catch(e) { console.warn('Sheet load failed, using defaults', e); }
  showLoading(false);
}

async function saveToSheet(pin) {
  if (!SCRIPT_URL) { alert('SCRIPT_URLが設定されていません'); return false; }
  showLoading(true);

  // Step1: GETでデータ取得 → その中のPINで確認（別エンドポイント不要）
  let currentConfig;
  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    currentConfig = data.config || {};
  } catch(e) {
    showLoading(false);
    alert('通信エラー: ' + e.message);
    return false;
  }

  if (!currentConfig.pin || String(currentConfig.pin) !== String(pin)) {
    showLoading(false);
    alert('PINが違います（シートのPIN: ' + (currentConfig.pin || '未設定') + '）');
    return false;
  }

  // Step2: Base64 GETで保存（日本語も安全、レスポンスも読める）
  try {
    const json = JSON.stringify({ pin, config: draftConfig, conditions: draftConditions });
    const b64  = btoa(unescape(encodeURIComponent(json)));
    const url  = SCRIPT_URL + '?action=save&t=' + Date.now() + '&data=' + encodeURIComponent(b64);
    const res  = await fetch(url);
    const result = await res.json();
    showLoading(false);
    if (result.error) { alert('保存エラー: ' + result.error); return false; }
    await loadFromSheet();
    return !!result.success;
  } catch(e) {
    showLoading(false);
    alert('保存に失敗しました: ' + e.message);
    return false;
  }
}

function showLoading(v) {
  document.getElementById('loading').classList.toggle('show', v);
}

/* ── 初期化 ── */
async function init() {
  await loadFromSheet();
  updateDeadline();
  render();
  calcTotal();
}

function updateDeadline() {
  document.getElementById('deadline-disp').textContent = config.deadline || '';
}

/* ── キャリア ── */
function selectCarrier(key) {
  carrier = key; checked = {}; units = {}; uqDenki = false; shinsho = false;
  document.querySelectorAll('.carrier-btn').forEach(b => b.classList.remove('sel'));
  document.querySelector('.c-' + key).classList.add('sel');
  updateShinsho(); render(); calcTotal();
}

/* ── 信賞店舗 ── */
function updateShinsho() {
  const sec = document.getElementById('shinsho-section');
  if (carrier !== 'docomo') { sec.style.display = 'none'; return; }
  const bonus = conditions.filter(c => +c.docomo_shinsho > 0);
  if (!bonus.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  document.getElementById('shinsho-sw').className = 'sw' + (shinsho ? ' on' : '');
  document.getElementById('shinsho-bar').className = 'shinsho-bar' + (shinsho ? ' on' : '');
  document.getElementById('shinsho-main').textContent = shinsho ? '信賞店舗' : '通常店舗';
  document.getElementById('shinsho-sub').textContent = shinsho
    ? bonus.map(c => c.name + ' +' + (+c.docomo_shinsho).toLocaleString() + 'pt').join('／') + ' 増額中'
    : '信賞店舗に切替で ' + bonus.map(c => c.name).join('・') + ' が増額';
}
function toggleShinsho() { shinsho = !shinsho; updateShinsho(); render(); calcTotal(); }

/* ── 前提条件 ── */
function togglePrereq(key) {
  prereqs[key] = !prereqs[key];
  const el = document.getElementById('pi-' + key);
  el.classList.toggle('on', prereqs[key]);
  el.textContent = prereqs[key] ? '✓' : '';
  render(); calcTotal();
}

/* ── 条件データ（動的） ── */
function getConds() {
  if (!carrier) return [];
  const opOK = prereqs.bunkatsu || prereqs.shitadori;
  return conditions.map(c => {
    const base    = +c[carrier] || 0;
    const shinshoB = (carrier === 'docomo' && shinsho) ? +c.docomo_shinsho || 0 : 0;
    const pts     = base + shinshoB;
    const unitMin = carrier === 'docomo' ? +c.docomo_unit_min || 0
                  : carrier === 'au'     ? +c.au_unit_min     || 0 : 0;
    return {
      id:       c.id,
      name:     c.name,
      note:     c.note || '',
      pts,
      reqFail:  +c.needs_prereq === 1 && !opOK,
      perUnit:  unitMin > 0,
      unitMin,
      uqDenki:  carrier === 'uq' && +c.uq_denki === 1,
    };
  });
}

/* ── レンダリング ── */
function render() {
  const list  = document.getElementById('cond-list');
  const conds = getConds();
  if (!conds.length) {
    list.innerHTML = '<div class="placeholder">⬆️ まずキャリアを選択してください</div>';
    return;
  }
  list.innerHTML = '';
  conds.forEach(c => {
    const isOn   = !!checked[c.id];
    const isZero = c.pts === 0;
    const ptsHtml = isZero
      ? `<div class="pts zero">0 pt</div>`
      : `<div class="pts">${calcPts(c).toLocaleString()} pt</div>`;
    let cls = 'cond-card' + (isOn ? ' on' : '');
    if (c.reqFail) cls += ' off-req';
    else if (isZero) cls += ' off-zero';
    const el = document.createElement('div');
    el.className = cls;
    if (!isZero && !c.reqFail) el.onclick = () => toggleCond(c.id);
    el.innerHTML = `
      <div class="cond-row">
        <div class="cond-chk">${isOn ? '✓' : ''}</div>
        <div class="cond-info">
          <div class="cond-name">${esc(c.name)}</div>
          ${c.note ? `<div class="cond-note">${esc(c.note)}</div>` : ''}
        </div>
        ${ptsHtml}
      </div>
      ${buildSub(c, isOn)}`;
    list.appendChild(el);
  });
}

function calcPts(c) {
  let p = c.pts;
  if (c.perUnit) p = c.pts * (units[c.id] || c.unitMin || 1);
  if (c.uqDenki && checked[c.id] && uqDenki) p += (+conditions.find(x=>x.id===c.id)?.uq || 0);
  // uq_denki bonus is stored as a separate lookup
  return p;
}

function buildSub(c, isOn) {
  if (!isOn) return '';
  if (c.perUnit) {
    const min = c.unitMin || 1, val = units[c.id] || min;
    const lbl = c.id === 'kazoku' ? '家族台数' : '台数';
    return `<div class="sub-row show">
      <span class="sub-lbl">📌 ${lbl}（${min}台〜）</span>
      <input class="sub-num" type="number" min="${min}" max="20" value="${val}"
        oninput="setUnit('${c.id}',this.value,${min});render();"
        onchange="setUnit('${c.id}',this.value,${min});render();">
      <span class="sub-unit">台</span></div>`;
  }
  if (c.uqDenki) {
    const uqBonus = conditions.find(x => x.id === c.id);
    const bonusPts = uqBonus ? +uqBonus.docomo_shinsho || 5000 : 5000;
    // UQ denki bonus: use a dedicated field approach - fixed at 5000 for now
    return `<div class="sub-row show">
      <span class="sub-lbl">⚡ でんきも同時契約で +5,000pt</span>
      <div class="sub-chk ${uqDenki?'on':''}" onclick="toggleUqDenki(event)">${uqDenki?'✓':''}</div></div>`;
  }
  return '';
}

function toggleCond(id) {
  checked[id] = !checked[id];
  if (!checked[id]) { delete units[id]; if (id === 'hikari') uqDenki = false; }
  render(); calcTotal();
}
function toggleUqDenki(e) { e.stopPropagation(); uqDenki = !uqDenki; render(); calcTotal(); }
function setUnit(id, val, min) { units[id] = Math.max(min||1, parseInt(val)||(min||1)); calcTotal(); }

/* ── 合計 ── */
function calcTotal() {
  const numEl = document.getElementById('total-num');
  const carEl = document.getElementById('total-carrier');
  if (!carrier) { numEl.textContent = '0'; carEl.textContent = '-'; return; }
  carEl.textContent = C_LABEL[carrier];
  let total = 0;
  getConds().forEach(c => {
    if (!checked[c.id] || c.pts === 0 || c.reqFail) return;
    let p = c.pts;
    if (c.perUnit) p = c.pts * (units[c.id] || c.unitMin || 1);
    if (c.uqDenki && uqDenki) p += 5000;
    total += p;
  });
  numEl.textContent = total.toLocaleString();
}

/* ── リセット ── */
function resetAll() {
  carrier = null; prereqs = { bunkatsu: false, shitadori: false };
  checked = {}; units = {}; uqDenki = false; shinsho = false;
  document.querySelectorAll('.carrier-btn').forEach(b => b.classList.remove('sel'));
  ['bunkatsu','shitadori'].forEach(k => {
    const el = document.getElementById('pi-' + k);
    el.classList.remove('on'); el.textContent = '';
  });
  updateShinsho(); render(); calcTotal();
}

/* ── PINモーダル ── */
function openPinModal() {
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-modal').classList.add('show');
  setTimeout(() => document.getElementById('pin-input').focus(), 300);
}
function closePinModal() { document.getElementById('pin-modal').classList.remove('show'); }
function submitPin() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) { document.getElementById('pin-error').textContent = 'PINを入力してください'; return; }
  enteredPin = pin;
  closePinModal();
  openSettingsScreen();
}

/* ── 設定画面 ── */
function openSettingsScreen() {
  draftConfig     = JSON.parse(JSON.stringify(config));
  draftConditions = JSON.parse(JSON.stringify(conditions));
  expandedId      = null;
  document.getElementById('s-deadline').value = draftConfig.deadline || '';
  renderCondEditor();
  document.getElementById('settings-screen').classList.add('open');
}

function discardSettings() {
  document.getElementById('settings-screen').classList.remove('open');
}

async function saveSettings() {
  const dl = document.getElementById('s-deadline').value.trim();
  if (dl) draftConfig.deadline = dl;

  const btn = document.getElementById('s-save-btn');
  btn.disabled = true; btn.textContent = '保存中...';

  let ok = false;
  if (SCRIPT_URL) {
    ok = await saveToSheet(enteredPin);
    if (ok) { await loadFromSheet(); }
  } else {
    // ローカル保存（SCRIPT_URL未設定時）
    config     = draftConfig;
    conditions = draftConditions;
    ok = true;
  }

  btn.disabled = false; btn.textContent = '💾 全員に反映';
  if (ok) {
    updateDeadline(); render(); calcTotal(); updateShinsho();
    document.getElementById('settings-screen').classList.remove('open');
  }
}

/* ── 条件エディタ ── */
function renderCondEditor() {
  const list = document.getElementById('s-cond-list');
  list.innerHTML = '';
  draftConditions.forEach((c, i) => list.appendChild(buildCondCard(c, i)));
}

function buildCondCard(c, idx) {
  const expanded = expandedId === c.id;
  const wrap = document.createElement('div');
  wrap.className = 's-cond-card' + (expanded ? ' expanded' : '');

  wrap.innerHTML = `
    <div class="s-cond-header" onclick="toggleExpand('${c.id}')">
      <div class="s-cond-order">
        <button class="s-order-btn" onclick="moveUp(${idx});event.stopPropagation();">↑</button>
        <button class="s-order-btn" onclick="moveDown(${idx});event.stopPropagation();">↓</button>
      </div>
      <div class="s-cond-preview">
        <div class="s-cond-preview-name">${esc(c.name) || '（未設定）'}</div>
        ${c.note ? `<div class="s-cond-preview-note">${esc(c.note)}</div>` : ''}
      </div>
      <div class="s-expand-icon">${expanded ? '▲' : '▼'}</div>
    </div>
    ${expanded ? buildCondBody(c) : ''}`;
  return wrap;
}

function buildCondBody(c) {
  return `<div class="s-cond-body">
    <div class="s-field">
      <div class="s-field-label">条件名</div>
      <input class="s-field-input" value="${esc(c.name)}" oninput="updCond('${c.id}','name',this.value)">
    </div>
    <div class="s-field">
      <div class="s-field-label">補足メモ（短く）</div>
      <input class="s-field-input" value="${esc(c.note)}" placeholder="例：信賞店舗で増額あり" oninput="updCond('${c.id}','note',this.value)">
    </div>
    <div class="s-flags">
      <div class="s-flag" onclick="togFlag('${c.id}','needs_prereq')">
        <span class="s-flag-label">前提条件が必要<br><small style="color:#8e8e93">（分割/下取り）</small></span>
        <div class="mini-sw ${+c.needs_prereq ? 'on' : ''}"></div>
      </div>
      <div class="s-flag" onclick="togFlag('${c.id}','uq_denki')">
        <span class="s-flag-label">UQでんきボーナス<br><small style="color:#8e8e93">（光と同時で+5,000）</small></span>
        <div class="mini-sw ${+c.uq_denki ? 'on' : ''}"></div>
      </div>
    </div>
    <div class="s-unit-row">
      <div class="s-unit-item">
        <span class="s-unit-label">ドコモ 台数入力（0=なし）</span>
        <input class="s-unit-input" type="number" min="0" max="20" value="${+c.docomo_unit_min||0}"
          oninput="updCond('${c.id}','docomo_unit_min',+this.value)">
        <span style="font-size:12px;">台〜</span>
      </div>
      <div class="s-unit-item">
        <span class="s-unit-label">AU 台数入力（0=なし）</span>
        <input class="s-unit-input" type="number" min="0" max="20" value="${+c.au_unit_min||0}"
          oninput="updCond('${c.id}','au_unit_min',+this.value)">
        <span style="font-size:12px;">台〜</span>
      </div>
    </div>
    <div class="s-pts-section">
      <div class="s-pts-title">ポイント数（pt）</div>
      <div class="s-pts-row">
        <span class="s-carrier-badge docomo">ドコモ</span>
        <input class="s-pts-input" type="number" min="0" step="500" value="${+c.docomo||0}" oninput="updCond('${c.id}','docomo',+this.value)">
        <span class="s-shinsho-lbl">信賞ボーナス</span>
        <input class="s-pts-input" type="number" min="0" step="500" value="${+c.docomo_shinsho||0}" oninput="updCond('${c.id}','docomo_shinsho',+this.value)">
      </div>
      ${['au','sb','ym','uq'].map(k => `
      <div class="s-pts-row">
        <span class="s-carrier-badge ${k}">${C_LABEL[k]}</span>
        <input class="s-pts-input" type="number" min="0" step="500" value="${+c[k]||0}" oninput="updCond('${c.id}','${k}',+this.value)">
      </div>`).join('')}
    </div>
    <button class="s-delete-btn" onclick="deleteCond('${c.id}')">🗑️ この条件を削除</button>
  </div>`;
}

function toggleExpand(id) { expandedId = expandedId === id ? null : id; renderCondEditor(); }
function updCond(id, field, val) { const c = draftConditions.find(x => x.id === id); if (c) c[field] = val; }
function togFlag(id, field) {
  const c = draftConditions.find(x => x.id === id);
  if (c) { c[field] = +c[field] ? 0 : 1; renderCondEditor(); }
}
function moveUp(i)   { if (i===0) return; [draftConditions[i-1],draftConditions[i]]=[draftConditions[i],draftConditions[i-1]]; renderCondEditor(); }
function moveDown(i) { if (i===draftConditions.length-1) return; [draftConditions[i],draftConditions[i+1]]=[draftConditions[i+1],draftConditions[i]]; renderCondEditor(); }
function addCondition() {
  const id = 'c' + Date.now();
  draftConditions.push({ id, name:'新しい条件', note:'', needs_prereq:0, docomo_unit_min:0, au_unit_min:0, uq_denki:0, docomo:0, docomo_shinsho:0, au:0, sb:0, ym:0, uq:0 });
  expandedId = id;
  renderCondEditor();
  setTimeout(() => document.getElementById('settings-screen').scrollTo({ top: 99999, behavior: 'smooth' }), 100);
}
function deleteCond(id) {
  if (!confirm('この条件を削除しますか？')) return;
  draftConditions = draftConditions.filter(c => c.id !== id);
  if (expandedId === id) expandedId = null;
  renderCondEditor();
}

/* ── ユーティリティ ── */
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
</body>
